openapi: 3.0.3
info:
  title: Shrimp Laravel API
  version: 1.1.0
servers:
  - url: /api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token
  parameters:
    TenantHeader:
      name: X-Tenant
      in: header
      required: true
      schema:
        type: string
      description: Tenant slug. Required for tenant-scoped endpoints.
  schemas:
    Error422:
      type: object
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    Error403:
      type: object
      properties:
        message: { type: string }
    User:
      type: object
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role:
          type: string
          enum: [Owner, Admin, Production, Inventory, Finance, ReadOnly]
    AuthTokenResponse:
      type: object
      properties:
        token_type: { type: string, example: Bearer }
        access_token: { type: string }
        user: { $ref: '#/components/schemas/User' }
    Farm:
      type: object
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        name: { type: string }
        location: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Pond:
      type: object
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        farm_id: { type: integer }
        code: { type: string }
        name: { type: string, nullable: true }
        area_ha: { type: number, format: float }
        avg_depth_m: { type: number, format: float, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Cycle:
      type: object
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        pond_id: { type: integer }
        status:
          type: string
          enum: [active, harvested, cancelled]
        started_at: { type: string, format: date }
        ended_at: { type: string, format: date, nullable: true }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Stocking:
      type: object
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        cycle_id: { type: integer }
        stocked_at: { type: string, format: date }
        pl_qty: { type: integer }
        hatchery_code: { type: string, nullable: true }
        batch_code: { type: string, nullable: true }
        initial_pp_grams: { type: number, format: float, nullable: true }
        density_pl_m2: { type: number, format: float }
        density_pl_ha: { type: number, format: float }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Sampling:
      type: object
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        cycle_id: { type: integer }
        sampled_at: { type: string, format: date }
        pp_grams: { type: number, format: float }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Harvest:
      type: object
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        cycle_id: { type: integer }
        harvested_at: { type: string, format: date }
        type:
          type: string
          enum: [partial, final]
        total_lbs: { type: number, format: float }
        avg_pp_grams: { type: number, format: float, nullable: true }
        guide_number: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FeedType:
      type: object
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        name: { type: string }
        brand: { type: string, nullable: true }
        protein_pct: { type: number, format: float, nullable: true }
        cost_per_kg: { type: number, format: float, nullable: true }
        notes: { type: string, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FeedEntry:
      type: object
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        cycle_id: { type: integer }
        feed_type_id: { type: integer }
        fed_at: { type: string, format: date }
        amount_kg: { type: number, format: float }
        notes: { type: string, nullable: true }
        feed_type:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CycleMetrics:
      type: object
      properties:
        densities:
          type: object
          properties:
            pl_m2: { type: number, format: float, nullable: true }
            pl_ha: { type: number, format: float, nullable: true }
        sampling:
          type: object
          properties:
            latest_pp_grams: { type: number, format: float, nullable: true }
            growth_g_per_week: { type: number, format: float, nullable: true }
        feed:
          type: object
          properties:
            total_feed_kg: { type: number, format: float }
        harvest:
          type: object
          properties:
            total_lbs: { type: number, format: float }
            total_kg: { type: number, format: float }
        mortality:
          type: object
          properties:
            total_mortality: { type: integer }
        estimated_alive_count: { type: number, format: float, nullable: true }
        fcr: { type: number, format: float }
        biomass_kg: { type: number, format: float, nullable: true }
        recommended_feed_kg_per_day: { type: number, format: float, nullable: true }
        feeding_strategy_used:
          type: string
          enum: [biomass_percentage, growth_table, manual_adjustment]
    DailyMortality:
      type: object
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        cycle_id: { type: integer }
        pond_id: { type: integer }
        recorded_at: { type: string, format: date }
        mortality_count: { type: integer }
        notes: { type: string, nullable: true }
        created_by: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CycleProjection:
      type: object
      properties:
        current:
          type: object
          properties:
            latest_pp_grams: { type: number, format: float, nullable: true }
            latest_survival_pct: { type: number, format: float, nullable: true }
            current_biomass_kg: { type: number, format: float, nullable: true }
            current_fcr: { type: number, format: float, nullable: true }
            current_total_cost: { type: number, format: float }
        projection:
          type: object
          properties:
            target_pp_grams: { type: number, format: float }
            projected_avg_pp_grams: { type: number, format: float }
            projected_harvest_date: { type: string, format: date, nullable: true }
            projected_biomass_kg: { type: number, format: float, nullable: true }
            projected_total_lbs: { type: number, format: float, nullable: true }
            projected_fcr: { type: number, format: float, nullable: true }
            projected_revenue: { type: number, format: float, nullable: true }
            projected_cost: { type: number, format: float, nullable: true }
            projected_profit: { type: number, format: float, nullable: true }
        assumptions:
          type: object
          properties:
            sale_price_per_lb: { type: number, format: float }
            feed_cost_factor_per_kg_gain: { type: number, format: float }
            growth_g_per_week: { type: number, format: float, nullable: true }
    EffectiveSetting:
      type: object
      properties:
        feeding_strategy:
          type: string
          enum: [biomass_percentage, growth_table, manual_adjustment]
        feeding_pct_small: { type: number, format: float }
        feeding_pct_medium: { type: number, format: float }
        feeding_pct_large: { type: number, format: float }
        allow_post_close_adjustments: { type: boolean }
        unit_system:
          type: string
          enum: [metric, imperial]
        decimals_precision: { type: integer }
        default_target_pp_grams: { type: number, format: float }
        default_sale_price_per_lb: { type: number, format: float }
        default_feed_cost_factor_per_kg_gain: { type: number, format: float }
    FeedingGrowthTable:
      type: object
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        farm_id: { type: integer, nullable: true }
        name: { type: string }
        is_active: { type: boolean }
        rows:
          type: array
          items: { $ref: '#/components/schemas/FeedingGrowthTableRow' }
    FeedingGrowthTableRow:
      type: object
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        table_id: { type: integer }
        day_from: { type: integer }
        day_to: { type: integer }
        pp_from_grams: { type: number, format: float, nullable: true }
        pp_to_grams: { type: number, format: float, nullable: true }
        feed_pct: { type: number, format: float }
    AlertRule:
      type: object
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        farm_id: { type: integer, nullable: true }
        code:
          type: string
          enum: [LOW_GROWTH, HIGH_FCR, FEED_DEVIATION, HIGH_BIOMASS, HIGH_DAILY_MORTALITY, DO_LOW, PH_OUT_OF_RANGE]
        is_active: { type: boolean }
        params_json: { type: object, nullable: true, additionalProperties: true }
        severity:
          type: string
          enum: [info, warning, critical]
    AlertEvent:
      type: object
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        farm_id: { type: integer }
        cycle_id: { type: integer }
        rule_code:
          type: string
          enum: [LOW_GROWTH, HIGH_FCR, FEED_DEVIATION, HIGH_BIOMASS, HIGH_DAILY_MORTALITY, DO_LOW, PH_OUT_OF_RANGE]
        severity:
          type: string
          enum: [info, warning, critical]
        title: { type: string }
        message: { type: string }
        detected_at: { type: string, format: date-time }
        context_json: { type: object, nullable: true, additionalProperties: true }
        state:
          type: string
          enum: [open, acknowledged, resolved]
        is_acknowledged: { type: boolean }
        acknowledged_by_user_id: { type: integer, nullable: true }
        acknowledged_at: { type: string, format: date-time, nullable: true }
        resolved_by_user_id: { type: integer, nullable: true }
        resolved_at: { type: string, format: date-time, nullable: true }
    WaterQualityEntry:
      type: object
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        cycle_id: { type: integer }
        pond_id: { type: integer }
        measured_at: { type: string, format: date-time }
        dissolved_oxygen_mg_l: { type: number, format: float, nullable: true }
        ph: { type: number, format: float, nullable: true }
        temp_c: { type: number, format: float, nullable: true }
        salinity_ppt: { type: number, format: float, nullable: true }
        alkalinity_mg_l: { type: number, format: float, nullable: true }
        ammonia_mg_l: { type: number, format: float, nullable: true }
        nitrite_mg_l: { type: number, format: float, nullable: true }
        notes: { type: string, nullable: true }
        measured_by_user_id: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OperationalCostEntry:
      type: object
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        cycle_id: { type: integer }
        cost_type:
          type: string
          enum: [labor, energy, fuel, maintenance, chemicals, other]
        amount: { type: number, format: float }
        occurred_at: { type: string, format: date }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CycleCostSummary:
      type: object
      properties:
        totals:
          type: object
          properties:
            feed_cost: { type: number, format: float }
            operational_cost: { type: number, format: float }
            total_cost: { type: number, format: float }
        production:
          type: object
          properties:
            total_harvest_lbs: { type: number, format: float }
        metrics:
          type: object
          properties:
            cost_per_lb: { type: number, format: float }
            cost_per_ha: { type: number, format: float }
        missing_cost_inputs:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
    TenantDashboardFarmSummary:
      type: object
      properties:
        farm_id: { type: integer }
        farm_name: { type: string }
        active_cycles: { type: integer }
        biomass_kg: { type: number, format: float }
        alerts: { type: integer }
    TenantDashboard:
      type: object
      properties:
        active_cycles: { type: integer }
        total_active_area_ha: { type: number, format: float }
        total_biomass_kg: { type: number, format: float }
        total_projected_tons: { type: number, format: float }
        average_fcr: { type: number, format: float, nullable: true }
        total_feed_kg: { type: number, format: float }
        total_cost: { type: number, format: float }
        cost_per_lb_global: { type: number, format: float, nullable: true }
        critical_alerts: { type: integer }
        warning_alerts: { type: integer }
        farms_summary:
          type: array
          items: { $ref: '#/components/schemas/TenantDashboardFarmSummary' }
    FarmDashboardCycle:
      type: object
      properties:
        cycle_id: { type: integer }
        pond_code: { type: string }
        biomass_kg: { type: number, format: float }
        latest_pp: { type: number, format: float, nullable: true }
        fcr: { type: number, format: float, nullable: true }
        alerts: { type: integer }
    FarmDashboard:
      type: object
      properties:
        active_cycles: { type: integer }
        total_area_ha: { type: number, format: float }
        biomass_kg: { type: number, format: float }
        biomass_kg_per_ha: { type: number, format: float }
        avg_growth_g_per_week: { type: number, format: float, nullable: true }
        avg_fcr: { type: number, format: float, nullable: true }
        total_feed_kg: { type: number, format: float }
        total_cost: { type: number, format: float }
        cost_per_lb: { type: number, format: float, nullable: true }
        water_quality_latest:
          type: object
          properties:
            avg_do: { type: number, format: float, nullable: true }
            avg_ph: { type: number, format: float, nullable: true }
            avg_temp: { type: number, format: float, nullable: true }
        alerts:
          type: object
          properties:
            critical: { type: integer }
            warning: { type: integer }
            info: { type: integer }
        cycles:
          type: array
          items: { $ref: '#/components/schemas/FarmDashboardCycle' }
    Plan:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        billing_type:
          type: string
          enum: [monthly, yearly, lifetime, onprem]
        price_usd: { type: number, format: float, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PlanLimit:
      type: object
      properties:
        id: { type: integer }
        plan_id: { type: integer }
        key: { type: string }
        value: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PlanFeature:
      type: object
      properties:
        id: { type: integer }
        plan_id: { type: integer }
        feature_key: { type: string }
        is_enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TenantSubscription:
      type: object
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        plan_id: { type: integer }
        status:
          type: string
          enum: [active, trial, suspended, expired]
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time, nullable: true }
        license_key: { type: string, nullable: true }
        last_verified_at: { type: string, format: date-time, nullable: true }
        offline_grace_days: { type: integer, nullable: true }
        offline_mode_enabled: { type: boolean }
        verification_source:
          type: string
          enum: [cloud, onprem, manual]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SubscriptionStatusResponse:
      type: object
      properties:
        status:
          type: string
          nullable: true
          enum: [active, trial, suspended, expired]
        plan:
          type: object
          nullable: true
          properties:
            id: { type: integer, nullable: true }
            code: { type: string, nullable: true }
            name: { type: string, nullable: true }
            billing_type:
              type: string
              nullable: true
              enum: [monthly, yearly, lifetime, onprem]
        ends_at: { type: string, format: date-time, nullable: true }
        last_verified_at: { type: string, format: date-time, nullable: true }
        offline_grace_days: { type: integer, nullable: true }
        read_only_mode: { type: boolean }
paths:
  /auth/register:
    post:
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password }
                password_confirmation: { type: string, format: password }
                role:
                  type: string
                  enum: [Owner, Admin, Production, Inventory, Finance, ReadOnly]
                device_name: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokenResponse' }
  /auth/login:
    post:
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                device_name: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokenResponse' }
        '401': { description: Invalid credentials }
  /auth/me:
    get:
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '401': { description: Unauthorized }
  /auth/logout:
    post:
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }]
      responses:
        '204': { description: No Content }

  /subscription/status:
    get:
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionStatusResponse' }

  /farms:
    get:
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }]
      responses:
        '200':
          description: OK
          headers:
            X-Read-Only-Mode:
              description: Present with value `1` when tenant is allowed through offline grace in read-only mode.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Farm' }
    post:
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                location: { type: string }
                notes: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Farm' }
        '403':
          description: Forbidden (subscription inactive, read-only mode, or plan limit reached)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error403' }
  /farms/{farm}:
    get:
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/TenantHeader' }
        - in: path
          name: farm
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Farm' }
    patch:
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/TenantHeader' }
        - in: path
          name: farm
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Farm' }
    delete:
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/TenantHeader' }
        - in: path
          name: farm
          required: true
          schema: { type: integer }
      responses:
        '204': { description: No Content }

  /ponds:
    get:
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/TenantHeader' }
        - in: query
          name: farm_id
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Pond' }
    post:
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pond' }
  /ponds/{pond}:
    get:
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/TenantHeader' }
        - in: path
          name: pond
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pond' }
    patch:
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/TenantHeader' }
        - in: path
          name: pond
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pond' }
    delete:
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/TenantHeader' }
        - in: path
          name: pond
          required: true
          schema: { type: integer }
      responses:
        '204': { description: No Content }

  /ponds/{pond}/cycles:
    get:
      security: [{ bearerAuth: [] }]
      parameters:
